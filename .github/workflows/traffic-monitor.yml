name: Traffic monitor checks

on:
  pull_request:
    paths:
      - install.sh
      - shell/traffic_monitor.sh
      - tests/traffic_monitor_test.sh
      - documents/traffic-monitoring.md
      - .github/workflows/traffic-monitor.yml
  push:
    branches:
      - master
    paths:
      - install.sh
      - shell/traffic_monitor.sh
      - tests/traffic_monitor_test.sh
      - documents/traffic-monitoring.md
      - .github/workflows/traffic-monitor.yml

permissions:
  contents: read

concurrency:
  group: traffic-monitor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends jq shellcheck

      - name: Check shell syntax
        run: |
          bash -n install.sh
          bash -n shell/traffic_monitor.sh
          bash -n tests/traffic_monitor_test.sh

      - name: Run ShellCheck
        run: shellcheck -x shell/traffic_monitor.sh tests/traffic_monitor_test.sh

      - name: Run traffic monitor regression tests
        run: bash tests/traffic_monitor_test.sh
