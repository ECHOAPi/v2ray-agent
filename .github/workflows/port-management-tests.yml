name: Port management regression
on:
  pull_request:
    paths: ['install.sh', 'shell/install_en.sh', 'shell/port_manager/**', 'tests/**', '.github/workflows/port-management-tests.yml']
  push:
    branches: ['master', 'codex/port-management-v1']
    paths: ['install.sh', 'shell/install_en.sh', 'shell/port_manager/**', 'tests/**', '.github/workflows/port-management-tests.yml']
permissions:
  contents: read
jobs:
  isolated-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated test dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-yaml jq util-linux
      - name: Shell syntax
        run: bash -n install.sh && bash -n shell/install_en.sh
      - name: Isolated regressions (no installer, kernel or service changes)
        # The extracted installer lock wrapper checks EUID. All filesystem
        # fixtures stay in temporary directories; service/kernel commands are fake.
        run: sudo env PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=shell /usr/bin/python3 -m unittest discover -s tests -p 'test_port*.py' -v
