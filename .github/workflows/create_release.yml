name: Release Check

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  check-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the triggering commit
        uses: actions/checkout@v4
      - name: Publish the complete version (preserve historical releases and tags)
        uses: actions/github-script@v7
        with:
          script: |
            const { publishRelease } = require('./.github/scripts/release.cjs');
            await publishRelease({ github, context, core });
